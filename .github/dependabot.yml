version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Upgrade Node types together with the runtime in .node-version and package.json.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      development-patches:
        dependency-type: development
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
